<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>1911 Dogwear — Find a Retailer</title>
<link rel="stylesheet" href="https://use.typekit.net/yua3lml.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #C8102E;
  --red-dim: rgba(200,16,46,0.15);
  --white: #F5F0E8;
  --black: #080808;
  --surface: #111010;
  --surface2: #191716;
  --border: rgba(245,240,232,0.08);
  --border-mid: rgba(245,240,232,0.14);
  --muted: rgba(245,240,232,0.4);
  --muted2: rgba(245,240,232,0.6);
}

html, body {
  height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: "copperplate", Georgia, serif;
  overflow: hidden;
}

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-rows: 64px 1fr;
  grid-template-columns: 400px 1fr;
  height: 100vh;
}

/* ── HEADER ── */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 28px;
  background: var(--black);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}
.logo { display: flex; align-items: center; text-decoration: none; }
.logo-img-stacked { height: 35px; width: auto; display: block; }

.header-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--muted);
}
.header-right { display: flex; align-items: center; gap: 20px; }

.locate-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  font-family: inherit;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--white);
  background: transparent;
  border: 1px solid var(--border-mid);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.locate-btn:hover, .locate-btn:focus-visible { border-color: var(--red); background: var(--red-dim); outline: none; }
.locate-btn:disabled { opacity: 0.6; cursor: wait; }
.locate-btn svg { width: 14px; height: 14px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; }

.retailer-count { font-size: 10px; letter-spacing: 0.2em; color: var(--muted); }
.retailer-count span { color: var(--red); font-weight: 700; }

/* ── SIDEBAR ── */
.sidebar {
  grid-row: 2;
  grid-column: 1;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.search-wrap { padding: 16px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.search-box { position: relative; display: flex; align-items: center; }
.search-box svg {
  position: absolute; left: 12px; width: 14px; height: 14px;
  stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; pointer-events: none;
}
.search-box input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: inherit;
  font-size: 13px;
  letter-spacing: 0.06em;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input::placeholder { color: var(--muted); }
.search-box input:focus { border-color: var(--red); }

.filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.filter-chip {
  padding: 5px 12px;
  font-family: inherit;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted2);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active, .filter-chip:focus-visible {
  color: var(--white); border-color: var(--red); background: var(--red-dim); outline: none;
}

.sort-row {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.sort-label { font-size: 9px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }
.sort-select {
  background: transparent; border: none; color: var(--muted2);
  font-family: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
  cursor: pointer; outline: none;
}
.sort-select option { background: #191716; color: var(--white); }

.retailer-list { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.retailer-list::-webkit-scrollbar { width: 3px; }
.retailer-list::-webkit-scrollbar-track { background: transparent; }
.retailer-list::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.4); }

.retailer-card {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.retailer-card:hover, .retailer-card:focus-visible { background: var(--surface2); outline: none; }
.retailer-card.active { background: var(--surface2); border-left: 3px solid var(--red); padding-left: 17px; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
.card-name { font-size: 18px; letter-spacing: 0.06em; color: var(--white); line-height: 1.15; }
.card-distance { font-size: 11px; font-weight: 600; letter-spacing: 0.15em; color: var(--red); white-space: nowrap; padding-top: 2px; }
.card-city { font-size: 10px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.card-address { font-size: 13px; font-style: italic; color: var(--muted2); line-height: 1.4; margin-bottom: 8px; }
.card-hours {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px;
}
.card-hours svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }
.card-nomap { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); }

.card-actions { display: flex; gap: 8px; margin-top: 12px; }
.card-btn {
  flex: 1;
  padding: 7px 0;
  font-family: inherit;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  text-align: center;
  display: block;
}
.card-btn:hover, .card-btn:focus-visible { border-color: var(--red); color: var(--white); background: var(--red-dim); outline: none; }
.card-btn.primary { border-color: var(--red); color: var(--red); }
.card-btn.primary:hover { background: var(--red); color: var(--white); }
.card-btn[disabled] { opacity: 0.35; pointer-events: none; }

.list-message { padding: 60px 20px; text-align: center; color: var(--muted); }
.list-message p:first-child { font-size: 28px; color: rgba(245,240,232,0.2); margin-bottom: 8px; letter-spacing: 0.1em; }
.list-message p:last-child { font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }

/* ── MAP ── */
#map { grid-row: 2; grid-column: 2; width: 100%; height: 100%; z-index: 1; }
.leaflet-container { background: #0a0908; font-family: inherit; }
.leaflet-control-zoom { border: 1px solid var(--border-mid) !important; border-radius: 0 !important; }
.leaflet-control-zoom a {
  background: var(--surface) !important; color: var(--white) !important; border: none !important;
  border-bottom: 1px solid var(--border) !important; font-size: 16px !important; line-height: 26px !important;
}
.leaflet-control-zoom a:hover { background: var(--surface2) !important; }
.leaflet-control-attribution {
  background: rgba(8,8,8,0.7) !important; color: var(--muted) !important; font-size: 9px !important;
}
.leaflet-control-attribution a { color: var(--muted2) !important; }

.leaflet-popup-content-wrapper {
  background: var(--surface) !important; border: 1px solid var(--border-mid) !important; border-radius: 0 !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important; padding: 0 !important; color: var(--white);
}
.leaflet-popup-tip { background: var(--surface) !important; }
.leaflet-popup-content { margin: 0 !important; }
.leaflet-popup-close-button { color: var(--muted) !important; font-size: 16px !important; padding: 6px 8px !important; top: 4px !important; right: 4px !important; }

.popup-inner { padding: 16px 18px 14px; min-width: 200px; }
.popup-name { font-size: 20px; letter-spacing: 0.06em; color: var(--white); line-height: 1; margin-bottom: 4px; }
.popup-city { font-size: 9px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--red); margin-bottom: 8px; }
.popup-addr { font-size: 13px; font-style: italic; color: var(--muted2); line-height: 1.4; }
.popup-divider { height: 1px; background: var(--border); margin: 10px 0; }
.popup-hours { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }

.user-dot {
  width: 14px; height: 14px; background: var(--red); border-radius: 50%;
  border: 2px solid var(--white); box-shadow: 0 0 0 4px rgba(200,16,46,0.25);
}

.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface2); border: 1px solid var(--border-mid); color: var(--white);
  padding: 12px 24px; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase;
  z-index: 9999; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 64px 50vh 1fr; height: auto; min-height: 100vh; }
  html, body { overflow: auto; }
  header { padding: 0 16px; }
  .header-title { display: none; }
  #map { grid-row: 2; grid-column: 1; }
  .sidebar { grid-row: 3; grid-column: 1; overflow: visible; }
  .retailer-list { overflow: visible; }
}
@media (max-width: 480px) {
  .retailer-count { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>

<div class="app">
  <header>
    <a href="1911LandingPage.html" class="logo">
      <img src="logo-1911-laying-white.webp" alt="1911 Dogwear" class="logo-img-stacked">
    </a>
    <span class="header-title">Find a Retailer</span>
    <div class="header-right">
      <span class="retailer-count"><span id="visible-count">0</span> retailers found</span>
      <button class="locate-btn" id="locate-btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        <span>Near Me</span>
      </button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search by city or store name…" aria-label="Search by city or store name">
      </div>
      <div class="filter-row" id="filter-row" role="group" aria-label="Filter by region"></div>
    </div>

    <div class="sort-row">
      <label class="sort-label" for="sort-select">Sort by</label>
      <select class="sort-select" id="sort-select">
        <option value="name">Name</option>
        <option value="distance">Distance</option>
        <option value="city">City</option>
      </select>
    </div>

    <div class="retailer-list" id="retailer-list" aria-live="polite">
      <div class="list-message"><p>Loading</p><p>Finding 1911 retailers</p></div>
    </div>
  </aside>

  <div id="map" role="region" aria-label="Map of retailers"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- Same list as retailers.json, as a script, so the page also works when opened straight from a folder (file://) -->
<script src="retailers.js"></script>
<script>
/* Where the retailer list comes from. The sync job writes this file. */
const DATA_URL = 'retailers.json';

/* CARTO basemap key (free, register as commercial use at carto.com/basemaps/apikey).
   Without a key CARTO shows an "API key required" watermark on the map. */
const CARTO_KEY = 'cb1_4cp9_1_c9812f699c99e55461b576ea';

/* Region buttons, in display order. Only regions that have retailers are shown. */
const REGIONS = [
  { key: 'east',  label: 'East' },
  { key: 'south', label: 'South' },
  { key: 'west',  label: 'West' },
  { key: 'mid',   label: 'Mid' },
  { key: 'north', label: 'North' }
];

let RETAILERS = [];
let activeId = null;
let userPos = null;
let userMarker = null;
let filteredRetailers = [];
let activeFilter = 'all';
const markers = {};

/* Everything from the ERP is treated as text, never as HTML. */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === 'https:' || x.protocol === 'http:') ? x.href : ''; } catch (e) { return ''; }
}
function telHref(p) { return 'tel:' + String(p).replace(/[^\d+]/g, ''); }

// ── MAP ──
const map = L.map('map', { center: [64.5, 16.5], zoom: 5, zoomControl: true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' + (CARTO_KEY ? '?key=' + encodeURIComponent(CARTO_KEY) : ''), {
  maxZoom: 19,
  subdomains: 'abcd',
  /* CARTO checks which website the tiles are for. Send the site address with
     tile requests even if the site's own settings hide it (Referrer-Policy). */
  referrerPolicy: 'strict-origin-when-cross-origin',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
}).addTo(map);

function makeIcon(active) {
  return L.divIcon({
    className: '',
    html: `<svg width="32" height="40" viewBox="-2 -2 32 40" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 9.5 14 22 14 22S28 23.5 28 14C28 6.27 21.73 0 14 0z"
        fill="${active ? '#C8102E' : '#4a1a22'}" stroke="${active ? '#F5F0E8' : '#C8102E'}" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5" fill="${active ? '#F5F0E8' : '#C8102E'}"/>
    </svg>`,
    iconSize: [32, 40],
    iconAnchor: [16, 40],
    popupAnchor: [0, -38]
  });
}

function hasPos(r) { return typeof r.lat === 'number' && typeof r.lng === 'number'; }

function addMarker(r) {
  if (!hasPos(r) || markers[r.id]) return;
  const marker = L.marker([r.lat, r.lng], { icon: makeIcon(false), title: r.name, alt: r.name }).addTo(map);
  marker.bindPopup(`
    <div class="popup-inner">
      <div class="popup-name">${esc(r.name)}</div>
      <div class="popup-city">${esc(r.city)}</div>
      <div class="popup-addr">${esc(r.address)}</div>
      ${r.hours ? `<div class="popup-divider"></div><div class="popup-hours">${esc(r.hours)}</div>` : ''}
    </div>`, { maxWidth: 260 });
  marker.on('click', () => { setActive(r.id); scrollToCard(r.id); });
  markers[r.id] = marker;
}

// ── DISTANCE ──
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function distanceTo(r) { return (userPos && hasPos(r)) ? haversine(userPos.lat, userPos.lng, r.lat, r.lng) : null; }
function formatDist(km) { return km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(km < 10 ? 1 : 0)} km`; }

// ── LIST ──
function renderList(list) {
  const el = document.getElementById('retailer-list');
  document.getElementById('visible-count').textContent = list.length;

  if (list.length === 0) {
    el.innerHTML = `<div class="list-message"><p>No Results</p><p>Try a different search or filter</p></div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const dist = distanceTo(r);
    const web = safeUrl(r.website);
    return `
      <div class="retailer-card ${activeId === r.id ? 'active' : ''}" id="card-${r.id}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)}, ${esc(r.city)}">
        <div class="card-top">
          <div class="card-name">${esc(r.name)}</div>
          ${dist !== null ? `<div class="card-distance">${formatDist(dist)}</div>` : ''}
        </div>
        <div class="card-city">${esc(r.city)}</div>
        <div class="card-address">${esc(r.address)}</div>
        ${r.hours ? `<div class="card-hours"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>${esc(r.hours)}</div>` : ''}
        ${hasPos(r) ? '' : '<div class="card-nomap">Not on the map yet</div>'}
        <div class="card-actions">
          <button class="card-btn primary" type="button" data-fly="${r.id}" ${hasPos(r) ? '' : 'disabled'}>View on Map</button>
          <a class="card-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.name + ', ' + r.address)}" target="_blank" rel="noopener">Directions</a>
          ${r.phone ? `<a class="card-btn" href="${esc(telHref(r.phone))}">Call</a>` : ''}
          ${web ? `<a class="card-btn" href="${esc(web)}" target="_blank" rel="noopener">Website</a>` : ''}
        </div>
      </div>`;
  }).join('');
}

document.getElementById('retailer-list').addEventListener('click', e => {
  const fly = e.target.closest('[data-fly]');
  if (fly) { flyTo(parseInt(fly.dataset.fly, 10)); return; }
  if (e.target.closest('a')) return;
  const card = e.target.closest('.retailer-card');
  if (card) { const id = parseInt(card.dataset.id, 10); setActive(id); flyTo(id); }
});
document.getElementById('retailer-list').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const card = e.target.closest('.retailer-card');
  if (card && e.target === card) { e.preventDefault(); flyTo(parseInt(card.dataset.id, 10)); }
});

// ── ACTIVE ──
function setActive(id) {
  activeId = id;
  Object.entries(markers).forEach(([mid, m]) => m.setIcon(makeIcon(parseInt(mid, 10) === id)));
  document.querySelectorAll('.retailer-card').forEach(c => c.classList.toggle('active', parseInt(c.dataset.id, 10) === id));
}
function flyTo(id) {
  const r = RETAILERS.find(x => x.id === id);
  setActive(id);
  if (!r || !hasPos(r)) return;
  map.flyTo([r.lat, r.lng], 14, { duration: 1.2, easeLinearity: 0.25 });
  setTimeout(() => markers[id] && markers[id].openPopup(), 1000);
}
function scrollToCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── FILTERS, SEARCH, SORT ──
function buildRegionChips() {
  const present = new Set(RETAILERS.map(r => r.region));
  const chips = [{ key: 'all', label: 'All' }].concat(REGIONS.filter(x => present.has(x.key)));
  const row = document.getElementById('filter-row');
  row.innerHTML = chips.map(c => `<button type="button" class="filter-chip ${c.key === activeFilter ? 'active' : ''}" data-filter="${c.key}" aria-pressed="${c.key === activeFilter}">${c.label}</button>`).join('');
  row.querySelectorAll('.filter-chip').forEach(chip => chip.addEventListener('click', () => {
    activeFilter = chip.dataset.filter;
    row.querySelectorAll('.filter-chip').forEach(c => { c.classList.toggle('active', c === chip); c.setAttribute('aria-pressed', c === chip); });
    applyFilters();
  }));
}

function norm(s) {
  return String(s || '').toLowerCase().replace(/ø/g, 'o').replace(/æ/g, 'ae')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function applyFilters() {
  const query = norm(document.getElementById('search-input').value.trim());
  const sort = document.getElementById('sort-select').value;

  let result = RETAILERS.filter(r => {
    const text = norm(`${r.name} ${r.city} ${r.address} ${r.postcode}`);
    return (!query || text.includes(query)) && (activeFilter === 'all' || r.region === activeFilter);
  });

  if (sort === 'distance' && userPos) {
    result.sort((a, b) => (distanceTo(a) ?? Infinity) - (distanceTo(b) ?? Infinity));
  } else if (sort === 'city') {
    result.sort((a, b) => a.city.localeCompare(b.city, 'nb') || a.name.localeCompare(b.name, 'nb'));
  } else {
    result.sort((a, b) => a.name.localeCompare(b.name, 'nb'));
  }

  filteredRetailers = result;
  renderList(result);

  const visible = new Set(result.map(r => r.id));
  Object.entries(markers).forEach(([id, m]) => {
    const show = visible.has(parseInt(id, 10));
    if (show && !map.hasLayer(m)) m.addTo(map);
    if (!show && map.hasLayer(m)) map.removeLayer(m);
  });
}

document.getElementById('search-input').addEventListener('input', applyFilters);
document.getElementById('sort-select').addEventListener('change', () => {
  if (document.getElementById('sort-select').value === 'distance' && !userPos) {
    showToast('Press Near Me to sort by distance');
  }
  applyFilters();
});

function fitToRetailers() {
  const pts = RETAILERS.filter(hasPos).map(r => [r.lat, r.lng]);
  if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
}

// ── POSITIONS FOR ADDRESSES THE SYNC HAS NOT PLACED YET ──
/* The sync job normally adds lat/lng. If a retailer arrives without a position
   (e.g. before the first full sync), look it up once in Kartverket's address
   service and keep it for this browser session. */
async function lookup(params) {
  const url = 'https://ws.geonorge.no/adresser/v1/sok?' + new URLSearchParams(Object.assign({ treffPerSide: 1, utkoordsys: 4258 }, params));
  const res = await fetch(url);
  const data = await res.json();
  const hit = data.adresser && data.adresser[0] && data.adresser[0].representasjonspunkt;
  return hit ? { lat: hit.lat, lng: hit.lon } : null;
}

async function fillMissingPositions() {
  const missing = RETAILERS.filter(r => !hasPos(r) && r.postcode);
  for (const r of missing) {
    const key = 'pos:' + r.street + '|' + r.postcode;
    let pos = null;
    try { pos = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) {}
    if (!pos) {
      const streetOnly = (r.street || '').replace(/\s+\d+\s*[a-zA-Z]?\s*$/, '').trim();
      const attempts = [];
      if (r.street) attempts.push({ sok: r.street, postnummer: r.postcode });           // exact address
      if (streetOnly && streetOnly !== r.street) attempts.push({ sok: streetOnly, postnummer: r.postcode }); // street, any number
      attempts.push({ postnummer: r.postcode });                                        // postcode area (approximate)
      for (const a of attempts) {
        try { pos = await lookup(a); } catch (e) { pos = null; }
        if (pos) break;
      }
      if (pos) { try { sessionStorage.setItem(key, JSON.stringify(pos)); } catch (e) {} }
    }
    if (pos) { r.lat = pos.lat; r.lng = pos.lng; addMarker(r); }
  }
  if (missing.length) { fitToRetailers(); applyFilters(); }
}

// ── NEAR ME ──
document.getElementById('locate-btn').addEventListener('click', function () {
  const btn = this;
  const label = btn.querySelector('span');
  if (!navigator.geolocation) { showToast('Geolocation not supported'); return; }
  label.textContent = 'Locating…';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (userMarker) map.removeLayer(userMarker);
      const userIcon = L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
      userMarker = L.marker([userPos.lat, userPos.lng], { icon: userIcon, title: 'Your location' })
        .addTo(map).bindPopup('<div class="popup-inner"><div class="popup-name">Your Location</div></div>');
      document.getElementById('sort-select').value = 'distance';
      applyFilters();
      const nearest = filteredRetailers.find(hasPos);
      if (nearest) map.flyToBounds([[userPos.lat, userPos.lng], [nearest.lat, nearest.lng]], { padding: [60, 60], maxZoom: 12, duration: 1.5 });
      else map.flyTo([userPos.lat, userPos.lng], 8, { duration: 1.5 });
      showToast('Showing nearest retailers');
      label.textContent = 'Located';
      btn.disabled = false;
    },
    () => {
      showToast('Could not get your location');
      label.textContent = 'Near Me';
      btn.disabled = false;
    },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
  );
});

// ── TOAST ──
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

// ── START ──
async function init() {
  let data = null;
  try {
    const res = await fetch(DATA_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    data = window.RETAILERS_DATA || null; // fetch is blocked when the page is opened from a folder
  }
  try {
    if (!data) throw new Error('no data');
    RETAILERS = (data.retailers || []).map(r => ({
      id: r.id, name: r.name || '', city: r.city || '', address: r.address || '', street: r.street || '',
      postcode: r.postcode || '', region: r.region || '', lat: r.lat, lng: r.lng,
      phone: r.phone || '', website: r.website || '', hours: r.hours || ''
    }));
  } catch (e) {
    document.getElementById('retailer-list').innerHTML =
      '<div class="list-message"><p>Unavailable</p><p>The retailer list could not be loaded</p></div>';
    return;
  }
  RETAILERS.forEach(addMarker);
  buildRegionChips();
  applyFilters();
  fitToRetailers();
  fillMissingPositions();
}
init();
</script>
