<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1911 Dogwear — Find a Retailer</title>
<link rel="stylesheet" href="https://use.typekit.net/yua3lml.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --red: #C8102E;
  --red-dim: rgba(200,16,46,0.15);
  --white: #F5F0E8;
  --black: #080808;
  --surface: #111010;
  --surface2: #191716;
  --border: rgba(245,240,232,0.08);
  --border-mid: rgba(245,240,232,0.14);
  --muted: rgba(245,240,232,0.4);
  --muted2: rgba(245,240,232,0.6);
}

html, body {
  height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: "copperplate", serif;
  overflow: hidden;
}

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-rows: 64px 1fr;
  grid-template-columns: 400px 1fr;
  height: 100vh;
}

/* ── HEADER ── */
header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: var(--black);
  border-bottom: 1px solid var(--border);
  z-index: 1000;
}

.logo {
  display: flex;
  align-items: center;
  gap: 0;
  text-decoration: none;
}
  .logo-img-stacked {
    height: 35px;
    width: auto;
    display: block;
  }
.logo-num {
  font-family: "copperplate", serif;
  font-size: 28px;
  color: var(--white);
  letter-spacing: -0.5px;
  line-height: 1;
}
.logo-pipe {
  width: 3px;
  height: 28px;
  background: var(--red);
  margin: 0 5px;
  flex-shrink: 0;
}
.logo-dw {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.35em;
  color: var(--white);
  align-self: center;
  margin-top: 1px;
}

.header-title {
  font-family: "copperplate", serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: var(--muted);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

.locate-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 18px;
  font-family: "copperplate", serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--white);
  background: transparent;
  border: 1px solid var(--border-mid);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.locate-btn:hover { border-color: var(--red); background: var(--red-dim); }
.locate-btn svg { width: 14px; height: 14px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; }

.retailer-count {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--muted);
}
.retailer-count span { color: var(--red); font-weight: 700; }

/* ── SIDEBAR ── */
.sidebar {
  grid-row: 2;
  grid-column: 1;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.search-wrap {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.search-box {
  position: relative;
  display: flex;
  align-items: center;
}

.search-box svg {
  position: absolute;
  left: 12px;
  width: 14px;
  height: 14px;
  stroke: var(--muted);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  pointer-events: none;
}

.search-box input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--white);
  font-family: "copperplate", serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0.06em;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input::placeholder { color: var(--muted); }
.search-box input:focus { border-color: var(--red); }

.filter-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.filter-chip {
  padding: 5px 12px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--muted2);
  background: transparent;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}
.filter-chip:hover, .filter-chip.active {
  color: var(--white);
  border-color: var(--red);
  background: var(--red-dim);
}

/* Sort row */
.sort-row {
  padding: 10px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.sort-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
}

.sort-select {
  background: transparent;
  border: none;
  color: var(--muted2);
  font-family: "copperplate", serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  outline: none;
}
.sort-select option { background: #191716; color: var(--white); }

/* Retailer list */
.retailer-list {
  flex: 1;
  overflow-y: auto;
  scroll-behavior: smooth;
}
.retailer-list::-webkit-scrollbar { width: 3px; }
.retailer-list::-webkit-scrollbar-track { background: transparent; }
.retailer-list::-webkit-scrollbar-thumb { background: rgba(200,16,46,0.4); }

.retailer-card {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
}
.retailer-card:hover { background: var(--surface2); }
.retailer-card.active {
  background: var(--surface2);
  border-left: 3px solid var(--red);
  padding-left: 17px;
}

.card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 6px;
}

.card-name {
  font-family: "copperplate", serif;
  font-size: 18px;
  letter-spacing: 0.06em;
  color: var(--white);
  line-height: 1.1;
}

.card-distance {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--red);
  white-space: nowrap;
  padding-top: 2px;
}

.card-city {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.card-address {
  font-family: "copperplate", serif;
  font-size: 13px;
  font-style: italic;
  color: var(--muted2);
  line-height: 1.4;
  margin-bottom: 10px;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: 12px;
}

.card-hours {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
}
.card-hours svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; flex-shrink: 0; }

.card-status {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 3px 8px;
}
.card-status.open { color: #5a9e5a; background: rgba(90,158,90,0.12); }
.card-status.closed { color: #888; background: rgba(136,136,136,0.1); }

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.card-btn {
  flex: 1;
  padding: 7px 0;
  font-family: "copperplate", serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--muted2);
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  text-align: center;
  display: block;
}
.card-btn:hover { border-color: var(--red); color: var(--white); background: var(--red-dim); }
.card-btn.primary { border-color: var(--red); color: var(--red); }
.card-btn.primary:hover { background: var(--red); color: var(--white); }

.no-results {
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
}
.no-results p:first-child {
  font-family: "copperplate", serif;
  font-size: 28px;
  color: rgba(245,240,232,0.2);
  margin-bottom: 8px;
  letter-spacing: 0.1em;
}
.no-results p:last-child {
  font-size: 12px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}

/* ── MAP ── */
#map {
  grid-row: 2;
  grid-column: 2;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* Leaflet overrides */
.leaflet-container { background: #0a0908; }
.leaflet-control-zoom {
  border: 1px solid var(--border-mid) !important;
  border-radius: 0 !important;
}
.leaflet-control-zoom a {
  background: var(--surface) !important;
  color: var(--white) !important;
  border: none !important;
  border-bottom: 1px solid var(--border) !important;
  font-family: "copperplate", serif !important;
  font-size: 16px !important;
  line-height: 26px !important;
}
.leaflet-control-zoom a:hover { background: var(--surface2) !important; }
.leaflet-control-attribution { display: none; }

/* Custom popup */
.leaflet-popup-content-wrapper {
  background: var(--surface) !important;
  border: 1px solid var(--border-mid) !important;
  border-radius: 0 !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.7) !important;
  padding: 0 !important;
}
.leaflet-popup-tip { background: var(--surface) !important; }
.leaflet-popup-content { margin: 0 !important; }
.leaflet-popup-close-button {
  color: var(--muted) !important;
  font-size: 16px !important;
  padding: 6px 8px !important;
  top: 4px !important;
  right: 4px !important;
}

.popup-inner {
  padding: 16px 18px 14px;
  min-width: 200px;
}
.popup-name {
  font-family: "copperplate", serif;
  font-size: 20px;
  letter-spacing: 0.06em;
  color: var(--white);
  line-height: 1;
  margin-bottom: 4px;
}
.popup-city {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 8px;
}
.popup-addr {
  font-family: "copperplate", serif;
  font-size: 13px;
  font-style: italic;
  color: var(--muted2);
  margin-bottom: 10px;
  line-height: 1.4;
}
.popup-divider {
  height: 1px;
  background: var(--border);
  margin: 10px 0;
}
.popup-hours {
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
}

/* User location marker */
.user-dot {
  width: 14px; height: 14px;
  background: var(--red);
  border-radius: 50%;
  border: 2px solid var(--white);
  box-shadow: 0 0 0 4px rgba(200,16,46,0.25);
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface2);
  border: 1px solid var(--border-mid);
  color: var(--white);
  padding: 12px 24px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  z-index: 9999;
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 64px 50vh 1fr;
    overflow: auto;
  }
  html, body { overflow: auto; }
  #map { grid-row: 2; grid-column: 1; }
  .sidebar { grid-row: 3; grid-column: 1; height: auto; overflow: visible; }
  .retailer-list { overflow: visible; }
}
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <a href="1911LandingPage.html" class="logo">
   <img src="logo 1911 laying white.png" alt="1911 Dogwear" class="logo-img-stacked">
    </a>
    <span class="header-title">Find a Retailer</span>
    <div class="header-right">
      <span class="retailer-count"><span id="visible-count">8</span> retailers found</span>
      <button class="locate-btn" id="locate-btn">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
        Near Me
      </button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="search-wrap">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search by city or store name…">
      </div>
      <div class="filter-row">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="oslo">Oslo Area</button>
        <button class="filter-chip" data-filter="west">West Norway</button>
        <button class="filter-chip" data-filter="north">North</button>
      </div>
    </div>

    <div class="sort-row">
      <span class="sort-label">Sort by</span>
      <select class="sort-select" id="sort-select">
        <option value="name">Name</option>
        <option value="distance">Distance</option>
        <option value="city">City</option>
      </select>
    </div>

    <div class="retailer-list" id="retailer-list"></div>
  </aside>

  <!-- MAP -->
  <div id="map"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const RETAILERS = [
  {
    id: 1, name: "Villmarks-Spesialisten", city: "Oslo", region: "oslo",
    address: "Bogstadveien 2, 0355 Oslo",
    lat: 59.9282, lng: 10.7135,
    hours: "Mon–Fri 10:00–18:00 · Sat 10:00–16:00",
    phone: "+47 22 46 70 20",
    website: "https://villmarksspesialisten.no"
  },
  {
    id: 2, name: "Specsavers Sport", city: "Oslo", region: "oslo",
    address: "Karl Johans gate 41, 0162 Oslo",
    lat: 59.9127, lng: 10.7461,
    hours: "Mon–Sat 09:00–19:00 · Sun 11:00–17:00",
    phone: "+47 22 33 44 55",
    website: "#"
  },
  {
    id: 3, name: "Fjellsport Bergen", city: "Bergen", region: "west",
    address: "Strandgaten 18, 5004 Bergen",
    lat: 60.3929, lng: 5.3228,
    hours: "Mon–Fri 10:00–18:00 · Sat 10:00–15:00",
    phone: "+47 55 31 22 10",
    website: "#"
  },
  {
    id: 4, name: "Havgapet Utstyr", city: "Ålesund", region: "west",
    address: "Kirkegata 8, 6002 Ålesund",
    lat: 62.4722, lng: 6.1549,
    hours: "Mon–Fri 10:00–17:30 · Sat 10:00–15:00",
    phone: "+47 70 12 34 56",
    website: "#"
  },
  {
    id: 5, name: "Villmarkssport Trondheim", city: "Trondheim", region: "mid",
    address: "Nordre gate 10, 7011 Trondheim",
    lat: 63.4305, lng: 10.3951,
    hours: "Mon–Fri 09:30–18:00 · Sat 10:00–16:00",
    phone: "+47 73 52 90 10",
    website: "#"
  },
  {
    id: 6, name: "Friluft Stavanger", city: "Stavanger", region: "west",
    address: "Øvre Holmegate 5, 4006 Stavanger",
    lat: 58.9700, lng: 5.7331,
    hours: "Mon–Fri 10:00–18:00 · Sat 10:00–16:00",
    phone: "+47 51 84 30 20",
    website: "#"
  },
  {
    id: 7, name: "Arctic Gear Tromsø", city: "Tromsø", region: "north",
    address: "Storgata 64, 9008 Tromsø",
    lat: 69.6492, lng: 18.9553,
    hours: "Mon–Fri 10:00–17:00 · Sat 10:00–14:00",
    phone: "+47 77 68 50 40",
    website: "#"
  },
  {
    id: 8, name: "Sørlandet Sport", city: "Kristiansand", region: "south",
    address: "Markens gate 20, 4611 Kristiansand",
    lat: 58.1467, lng: 7.9956,
    hours: "Mon–Fri 09:30–17:30 · Sat 10:00–15:00",
    phone: "+47 38 02 11 90",
    website: "#"
  }
];

// State
let activeId = null;
let userPos = null;
let filteredRetailers = [...RETAILERS];
let activeFilter = 'all';
let markers = {};

// ── MAP INIT ──
const map = L.map('map', {
  center: [64.5, 16.5],
  zoom: 5,
  zoomControl: true
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19,
  subdomains: 'abcd'
}).addTo(map);

// ── CUSTOM MARKER ──
function makeIcon(active) {
  return L.divIcon({
    className: '',
    html: `<svg width="28" height="36" viewBox="0 0 28 36" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 0C6.27 0 0 6.27 0 14c0 9.5 14 22 14 22S28 23.5 28 14C28 6.27 21.73 0 14 0z"
        fill="${active ? '#C8102E' : '#4a1a22'}" stroke="${active ? '#F5F0E8' : '#C8102E'}" stroke-width="1.5"/>
      <circle cx="14" cy="14" r="5" fill="${active ? '#F5F0E8' : '#C8102E'}"/>
    </svg>`,
    iconSize: [28, 36],
    iconAnchor: [14, 36],
    popupAnchor: [0, -38]
  });
}

// ── ADD MARKERS ──
RETAILERS.forEach(r => {
  const marker = L.marker([r.lat, r.lng], { icon: makeIcon(false) }).addTo(map);

  marker.bindPopup(`
    <div class="popup-inner">
      <div class="popup-name">${r.name}</div>
      <div class="popup-city">${r.city}</div>
      <div class="popup-addr">${r.address}</div>
      <div class="popup-divider"></div>
      <div class="popup-hours">${r.hours}</div>
    </div>
  `, { maxWidth: 260 });

  marker.on('click', () => {
    setActive(r.id);
    scrollToCard(r.id);
  });

  markers[r.id] = marker;
});

// ── RENDER LIST ──
function isOpen(hours) {
  const now = new Date();
  const day = now.getDay();
  const h = now.getHours();
  if (day === 0) return false;
  if (day === 6) return h >= 10 && h < 16;
  return h >= 9 && h < 18;
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function formatDist(km) {
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
}

function renderList(retailers) {
  const list = document.getElementById('retailer-list');
  document.getElementById('visible-count').textContent = retailers.length;

  if (retailers.length === 0) {
    list.innerHTML = `<div class="no-results"><p>No Results</p><p>Try a different search or filter</p></div>`;
    return;
  }

  list.innerHTML = retailers.map(r => {
    const open = isOpen(r.hours);
    const dist = userPos ? haversine(userPos.lat, userPos.lng, r.lat, r.lng) : null;
    return `
      <div class="retailer-card ${activeId === r.id ? 'active' : ''}" id="card-${r.id}" data-id="${r.id}">
        <div class="card-top">
          <div class="card-name">${r.name}</div>
          ${dist !== null ? `<div class="card-distance">${formatDist(dist)}</div>` : ''}
        </div>
        <div class="card-city">${r.city}</div>
        <div class="card-address">${r.address}</div>
        <div class="card-meta">
          <div class="card-hours">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            ${r.hours.split('·')[0].trim()}
          </div>
          <span class="card-status ${open ? 'open' : 'closed'}">${open ? 'Open Now' : 'Closed'}</span>
        </div>
        <div class="card-actions">
          <button class="card-btn primary" onclick="flyTo(${r.id})">View on Map</button>
          <a class="card-btn" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(r.address)}" target="_blank">Directions</a>
          ${r.phone ? `<a class="card-btn" href="tel:${r.phone}">Call</a>` : ''}
        </div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.retailer-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
      const id = parseInt(card.dataset.id);
      setActive(id);
      flyTo(id);
    });
  });
}

// ── ACTIVE STATE ──
function setActive(id) {
  activeId = id;
  Object.entries(markers).forEach(([mid, m]) => {
    m.setIcon(makeIcon(parseInt(mid) === id));
  });
  renderList(filteredRetailers);
}

function flyTo(id) {
  const r = RETAILERS.find(x => x.id === id);
  if (!r) return;
  map.flyTo([r.lat, r.lng], 14, { duration: 1.2, easeLinearity: 0.25 });
  setTimeout(() => markers[id].openPopup(), 1000);
  setActive(id);
}

function scrollToCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

window.flyTo = flyTo;

// ── SEARCH ──
document.getElementById('search-input').addEventListener('input', function() {
  applyFilters();
});

// ── FILTERS ──
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', function() {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    activeFilter = this.dataset.filter;
    applyFilters();
  });
});

// ── SORT ──
document.getElementById('sort-select').addEventListener('change', function() {
  applyFilters();
});

function applyFilters() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const sort = document.getElementById('sort-select').value;

  let result = RETAILERS.filter(r => {
    const matchText = r.name.toLowerCase().includes(query) || r.city.toLowerCase().includes(query) || r.address.toLowerCase().includes(query);
    const matchFilter = activeFilter === 'all' || r.region === activeFilter;
    return matchText && matchFilter;
  });

  if (sort === 'distance' && userPos) {
    result.sort((a, b) => haversine(userPos.lat, userPos.lng, a.lat, a.lng) - haversine(userPos.lat, userPos.lng, b.lat, b.lng));
  } else if (sort === 'city') {
    result.sort((a, b) => a.city.localeCompare(b.city));
  } else {
    result.sort((a, b) => a.name.localeCompare(b.name));
  }

  filteredRetailers = result;
  renderList(result);

  // Show/hide markers
  RETAILERS.forEach(r => {
    const visible = result.find(x => x.id === r.id);
    if (visible) {
      if (!map.hasLayer(markers[r.id])) markers[r.id].addTo(map);
    } else {
      if (map.hasLayer(markers[r.id])) map.removeLayer(markers[r.id]);
    }
  });
}

// ── GEOLOCATION ──
document.getElementById('locate-btn').addEventListener('click', function() {
  if (!navigator.geolocation) {
    showToast('Geolocation not supported');
    return;
  }
  this.textContent = 'Locating…';
  this.disabled = true;
  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };

      // User dot marker
      const userIcon = L.divIcon({ className: '', html: '<div class="user-dot"></div>', iconSize: [14,14], iconAnchor: [7,7] });
      L.marker([userPos.lat, userPos.lng], { icon: userIcon }).addTo(map).bindPopup('<div class="popup-inner"><div class="popup-name">Your Location</div></div>');

      document.getElementById('sort-select').value = 'distance';
      applyFilters();
      map.flyTo([userPos.lat, userPos.lng], 7, { duration: 1.5 });
      showToast('Showing nearest retailers');

      document.getElementById('locate-btn').innerHTML = `<svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#C8102E;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg> Located`;
      document.getElementById('locate-btn').disabled = false;
    },
    () => {
      showToast('Could not get your location');
      document.getElementById('locate-btn').textContent = 'Near Me';
      document.getElementById('locate-btn').disabled = false;
    }
  );
});

// ── TOAST ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── INIT ──
renderList(RETAILERS.sort((a,b) => a.name.localeCompare(b.name)));
</script>
